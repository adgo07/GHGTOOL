[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qingzhou-carbon-accounting"
version = "1.1.0"
description = "青舟温室气体排放核算软件 Windows V1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "PySide6>=6.8,<7",
    "python-docx>=1.1,<2",
    "CoolProp==8.0.0",
    "numpy==2.3.3",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.22,<7",
]

[project.scripts]
qingzhou-carbon-accounting = "apps.carbon_accounting_desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "resources*"]

[tool.setuptools.package-data]
resources = [
    "licenses/steam_if97/*",
    "business_rules/fuel_power.json", "business_rules/material.json", "business_rules/fgd.json", "business_rules/heat.json",
    "branding/qingzhou_logo.png",
    "icons/factors.svg", "icons/excel.svg", "icons/home.svg", "icons/records.svg",
    "icons/new.svg", "icons/settings.svg", "icons/standards.svg",
    "icons/back.svg", "icons/tinted/*.svg",
    "excel_templates/*.xlsx",
]


"packages.application.reporting" = ["*.json"]
