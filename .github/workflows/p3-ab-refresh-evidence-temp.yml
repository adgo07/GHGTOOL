name: Temporary P3 AB Final Evidence Refresh

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/p3-ab-refresh-evidence-temp.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime
        run: python -m pip install -e .
      - name: Refresh six Qt offscreen screenshot and manifest sets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out="docs/ui/p3-ab/evidence"
          foreach ($dim in @(@(1366,768),@(1920,1080))) {
            foreach ($scale in @("1.0","1.25","1.5")) {
              python scripts/p3_ab_ui_acceptance.py --width $dim[0] --height $dim[1] --scale $scale --output-dir $out
              if ($LASTEXITCODE -ne 0) { throw "Qt evidence failed" }
            }
          }
          python -c "import json,hashlib,pathlib; root=pathlib.Path('.'); d=json.loads((root/'docs/ui/p3-ab/evidence/1366x768-100.json').read_text(encoding='utf-8')); assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==v for p,v in d['source_files_sha256'].items()), 'stale manifest hash'; print('Final UI source hash match: PASS')"
          if ($LASTEXITCODE -ne 0) { throw "Source hashes mismatch" }
      - name: Commit exact-head evidence
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/p3-ab/evidence/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "test(ui): refresh exact-source P3-AB Qt visual evidence [skip ci]"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:$env:HEAD_BRANCH"
            exit $LASTEXITCODE
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
