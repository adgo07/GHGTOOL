name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-312-tests:
    name: Windows / Python 3.12 / Full Tests and Standalone Audit
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build dependency
        run: python -m pip install -e ".[build]"

      - name: Validate canonical source
        run: python scripts/validate_canonical.py

      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Build standalone directory
        run: python scripts/build_standalone.py --output-root dist

      - name: Audit standalone directory
        run: python scripts/inspect_release.py dist/QingzhouCarbonAccounting

      - name: Smoke-test standalone startup
        run: python scripts/smoke_standalone.py dist/QingzhouCarbonAccounting

      - name: Upload standalone candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QingzhouCarbonAccounting-${{ github.sha }}
          path: dist/QingzhouCarbonAccounting
          if-no-files-found: error
          retention-days: 7